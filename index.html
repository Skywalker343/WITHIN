<!doctype html>
<html lang="en">
  <head>

    <meta name="theme-color" content="#f5f0f8" />
    <meta name="description" content="WITHIN — a reflective journey through your personal values." />
    <link rel="manifest" href="manifest.json" />

    <main class="device-shell" id="deviceShell">

        <span class="status-icons" aria-hidden="true"><i class="signal"></i><i class="wifi"></i><i class="battery"></i></span>

      </div>
      <div id="appRoot" class="app-root" aria-live="polite"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="home-indicator" aria-hidden="true"><span></span></div>
